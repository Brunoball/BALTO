      .balto-transition-media img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
      }

      .balto-transition-media.is-loaded { background-image: none; }

        font-weight: 600;

  <body>
    <noscript>Necesitás habilitar JavaScript para usar BALTO.</noscript>

    <div id="root"></div>

    <!--
      FUERA de #root y siempre en layout (visibility, no display:none):
      React no puede borrarlo y Chrome precarga/decodifica el GIF antes del click.
    -->
    <div
      id="balto-login-transition"
      role="status"
      aria-live="polite"
      aria-busy="false"
      aria-label="Cargando BALTO"
      aria-hidden="true"
    >
      <div class="balto-transition-media" id="balto-login-transition-media">
        <img
          id="balto-login-transition-gif"
          src="%PUBLIC_URL%/Balto_Carga.gif?v=20260908_clean_v5"
          alt=""
          aria-hidden="true"
          decoding="async"
          fetchpriority="high"
        />
      </div>
      <p class="balto-transition-text">Iniciando sesión...</p>
    </div>

    <script>
      (() => {
        'use strict';

        const overlay = document.getElementById('balto-login-transition');
        const media = document.getElementById('balto-login-transition-media');
        const gif = document.getElementById('balto-login-transition-gif');
        if (!overlay) return;

        let visible = false;

        const markGifLoaded = () => media?.classList.add('is-loaded');
        if (gif) {
          if (gif.complete && gif.naturalWidth > 0) markGifLoaded();
          gif.addEventListener('load', markGifLoaded, { once: true });
        }

        const setVisible = (next) => {
          const wanted = Boolean(next);
          visible = wanted;
          overlay.classList.toggle('is-visible', wanted);
          overlay.setAttribute('aria-hidden', wanted ? 'false' : 'true');
          overlay.setAttribute('aria-busy', wanted ? 'true' : 'false');
        };

        window.__BALTO_LOGIN_TRANSITION__ = {
          show: () => setVisible(true),
          hide: () => setVisible(false),
          isVisible: () => visible,
        };

        // Volver con back/forward cache nunca deja el login bloqueado.
        window.addEventListener('pageshow', () => setVisible(false));
      })();
    </script>
  </body>
